# FAC (Flow Actor-Critic, ICLR 2026, arXiv 2602.18015) offline on OGBench
# antmaze-large-navigate-singletask-v0. Reference command
# (3rd_party/FAC/README.md:44-45):
#   python main.py --env_name=antmaze-large-navigate-singletask-v0 \
#     --agent.fac_alpha=0.5 --agent.fac_lambda=0.1 \
#     --agent.fac_threshold='dataset_wide_constant'
#
# env_id vs offline_dataset: OGBench's dataset name keeps the dataset-type
# word ("navigate") immediately before "singletask"; the env id drops it --
# see docs/guides/ogbench-integration.md's "env-id vs dataset-name" section
# (copied from configs/offline/floq_antmaze_large_navigate_v0_paper.yaml).
#
# Left at FACArgs/OfflineFQLArgs defaults for explicitness (match the
# reference's fac.py:493-524 defaults for this task): q_agg=min,
# logp_method=exact, weight_type=linear, gamma=0.995, tau=0.005,
# flow_steps=10. bc_pretrain_steps left unset -- derived from
# bc_pretrain_epochs=250 (this port's Deviations, see
# rl_garden/algorithms/fac.py's module docstring). reward_scale=1.0/
# reward_bias=0.0 are also left at default: OGBench singletask rewards are
# already in [-1, 0] (same reasoning as the floq OGBench configs).
env_backend: ogbench
dataset_backend: ogbench
env_id: antmaze-large-singletask-v0
offline_dataset: antmaze-large-navigate-singletask-v0

# FAC's own train script offline budget for this task family; not
# OfflineDatasetArgs's own 100_000 default. Counts actor-critic updates
# only, matching the reference's offline_steps -- the BC-flow prelude (250
# epochs, bc_pretrain_epochs default) runs before these 1M AC updates and is
# not part of this count (rl_garden/algorithms/fac.py's module docstring).
num_offline_steps: 1000000

fac_alpha: 0.5
fac_lambda: 0.1
fac_threshold: dataset_wide_constant

num_eval_episodes: 50
eval_episode_horizon: 1000
eval_freq: 20000

log_type: wandb
seed: 0
