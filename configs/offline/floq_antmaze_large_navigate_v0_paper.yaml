# FloQ (Farebrother et al., arXiv 2509.06863) offline on OGBench
# antmaze-large-navigate-singletask-v0. Reference command (3rd_party/floq/README.md,
# "floq on state-based OGBench (default tasks)"):
#   python main.py --env_name=antmaze-large-navigate-singletask-v0 \
#     --agent=agents/floq.py --agent.alpha=10
#
# env_id vs offline_dataset: OGBench's dataset name keeps the dataset-type
# word ("navigate") immediately before "singletask"; the env id drops it --
# see docs/guides/ogbench-integration.md's "env-id vs dataset-name" section.
#
# Left at FloQArgs/OfflineFQLArgs defaults for explicitness (all match
# floq's own reference config, agents/floq.py get_config, for this task):
# gamma=0.99, batch_size=256, q_agg=mean, critic_flow_steps=8,
# noise_coverage=0.1, noise_samples=8, flow_num_ensembles=2,
# critic_flow_net_arch=None (falls back to net_arch, i.e. no block_depth
# override -- only cube-single/cube-double need block_depth=2).
# reward_scale=1.0/reward_bias=0.0 are also left at default: OGBench
# singletask rewards are already in [-1, 0], and r_min=-1.0/r_max=0.0
# (FloQArgs defaults) depend on that un-rescaled range -- do not copy the
# D4RL antmaze presets' reward_scale=10.0/reward_bias=-5.0.
env_backend: ogbench
dataset_backend: ogbench
env_id: antmaze-large-singletask-v0
offline_dataset: antmaze-large-navigate-singletask-v0
obs_mode: state

# floq's own train script offline budget for this task family; not
# OfflineDatasetArgs's own 100_000 default.
num_offline_steps: 1000000

alpha: 10.0

num_eval_episodes: 50
eval_episode_horizon: 1000
eval_freq: 20000

log_type: wandb
seed: 0
