# FloQ (Farebrother et al., arXiv 2509.06863) offline-to-online on OGBench
# antmaze-giant-navigate-singletask-v0. Reference command (3rd_party/floq/README.md,
# "Offline-to-online RL" -> "floq"), the floq-best variant (adds
# critic_flow_steps=4 on top of floq-def):
#   python main.py --env_name=antmaze-giant-navigate-singletask-v0 \
#     --offline_steps=1000000 --online_steps=2000000 --agent=agents/floq.py \
#     --agent.discount=0.995 --agent.q_agg=min --agent.batch_size=512 \
#     --agent.alpha=10 --agent.critic_flow_steps=4
#
# env_id vs offline_dataset: OGBench's dataset name keeps the dataset-type
# word ("navigate") immediately before "singletask"; the env id drops it --
# see docs/guides/ogbench-integration.md's "env-id vs dataset-name" section.
#
# online_replay_mode: append (not Off2OnCommonArgs's own "empty" default):
# floq keeps one buffer across offline pretraining and online fine-tuning
# and appends new online transitions to it, it does not discard the offline
# data at the offline/online boundary.
#
# num_eval_steps is set explicitly because FloQOff2OnArgs has no
# num_eval_episodes field to auto-derive a budget from (unlike the offline
# entrypoint's OfflineEvalArgs) -- sized as
# eval_episode_horizon * 50 episodes / num_eval_envs (1) to comfortably
# finish ~50 eval episodes per evaluation call.
#
# Left at FloQOff2OnArgs defaults for explicitness (match floq's own
# reference config for this task otherwise): noise_coverage=0.1,
# noise_samples=8, flow_num_ensembles=2, critic_flow_net_arch=None (no
# block_depth override -- cube-single/cube-double-only).
# reward_scale=1.0/reward_bias=0.0 are also left at default: OGBench
# singletask rewards are already in [-1, 0], and r_min=-1.0/r_max=0.0
# (FloQOff2OnArgs defaults) depend on that un-rescaled range -- do not copy
# the D4RL antmaze presets' reward_scale=10.0/reward_bias=-5.0.
env_backend: ogbench
dataset_backend: ogbench
env_id: antmaze-giant-singletask-v0
offline_dataset: antmaze-giant-navigate-singletask-v0

num_envs: 1
num_eval_envs: 1

num_offline_steps: 1000000
num_online_steps: 2000000

online_replay_mode: append

gamma: 0.995
q_agg: min
batch_size: 512
alpha: 10.0
critic_flow_steps: 4

eval_episode_horizon: 1000
num_eval_steps: 50000
offline_eval_freq: 20000
online_eval_freq: 20000

capture_video: false
log_type: wandb
seed: 0
