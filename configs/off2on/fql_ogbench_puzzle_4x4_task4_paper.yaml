# FQL state-based OGBench offline-to-online paper recipe (puzzle-4x4 play task4).
env_backend: ogbench
dataset_backend: ogbench
env_id: puzzle-4x4-singletask-task4-v0
offline_dataset: puzzle-4x4-play-singletask-task4-v0
num_envs: 1
num_eval_envs: 1
num_offline_steps: 1000000
num_online_steps: 1000000
buffer_size: 2000000
batch_size: 256
offline_sampling: with_replace
learning_starts: 0
training_freq: 1
utd: 1.0
warmup_steps: 0
online_replay_mode: append
offline_data_ratio: 0.0
bootstrap_at_done: truncated
gamma: 0.99
tau: 0.005
actor_lr: 0.0003
critic_lr: 0.0003
alpha: 1000.0
flow_steps: 10
q_agg: mean
normalize_q_loss: false
hidden_dim: 512
hidden_layers: 4
n_critics: 2
actor_use_layer_norm: false
critic_use_layer_norm: true
kernel_init: xavier_uniform
activation_fn: gelu
reference_compatible: true
weight_decay: 0.0
use_adamw: false
lr_schedule: constant
grad_clip_norm: null
reward_scale: 1.0
reward_bias: 0.0
num_eval_episodes: 50
eval_episode_horizon: 500
offline_eval_freq: 100000
online_eval_freq: 100000
checkpoint_freq: 100000
log_freq: 5000
log_type: wandb
seed: 0
