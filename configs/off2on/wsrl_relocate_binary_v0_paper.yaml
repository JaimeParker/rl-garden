# WSRL on Relocate-Binary-v0 (D4RL legacy, Cal-QL's own sparse Adroit
# variant). See wsrl_pen_binary_v0_paper.yaml for the full source
# reconciliation (WSRL's official adroit_cql/adroit_wsrl configs + the
# already-validated calql_relocate_binary_v0_paper.yaml's reward/budget/
# eval-horizon contract).
env_backend: d4rl_legacy
dataset_backend: h5
env_id: relocate-binary-v0
offline_dataset: null
obs_mode: state
num_envs: 1
num_eval_envs: 1

num_offline_steps: 20000
num_online_steps: 1000000
utd: 4.0
batch_size: 1024
buffer_size: 2000000
warmup_steps: 5000

reward_scale: 10.0
reward_bias: 5.0
sparse_reward_mc: true
sparse_negative_reward: -5.0
success_threshold: 0.5

hidden_dim: 512
actor_hidden_layers: 2
critic_hidden_layers: 3
std_parameterization: exp
kernel_init: orthogonal_near_zero_output

n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
backup_entropy: false
target_entropy: 0.0
bootstrap_at_done: truncated

use_cql_loss: true
cql_alpha: 1.0
cql_importance_sample: true
cql_max_target_backup: true
cql_clip_diff_min: -200.0
cql_clip_diff_max: 200.0

online_replay_mode: empty
offline_data_ratio: 0.0
online_cql_alpha: 0.0
online_use_cql_loss: false

policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
cql_alpha_lr: 0.0003
policy_frequency: 1
target_network_frequency: 1

# 20 episodes x 200-step horizon, matching calql_relocate_binary_v0_paper.yaml.
num_eval_steps: 4000
eval_freq: 0
offline_eval_freq: 2000
online_eval_freq: 2000

capture_video: false
log_type: wandb
seed: 0
