# Cal-QL on OGBench cube-single-singletask-v0 (state obs), offline-to-online.
# No official Cal-QL/CQL recipe exists for OGBench (unlike D4RL,
# which follow the Cal-QL paper, or locomotion, which follows WSRL's own
# official locomotion_cql config) -- OGBench's own released code
# (3rd_party/ogbench/impls) is offline-only, with no offline-to-online
# script to anchor hyperparameters on. Architecture/CQL hyperparameters
# below are therefore CalQLCore/CQLCore defaults (same precedent as
# configs/offline/calql_halfcheetah_medium_v2.yaml for locomotion before its
# own off2on config existed), not a claimed reproduction of anything.
#
# use_sarsa_reference is NOT set (defaults to False): unlike D4RL locomotion,
# OGBench manipulation tasks have a real terminal/success signal (`masks`),
# not an infinite-horizon continuing task, so the MC-return truncation bias
# this feature fixes does not apply here.
env_backend: ogbench
dataset_backend: ogbench
env_id: cube-single-singletask-v0
offline_dataset: cube-single-play-singletask-v0
num_envs: 4
num_eval_envs: 2

num_offline_steps: 100000
num_online_steps: 200000
batch_size: 256
buffer_size: 1000000
training_freq: 1
utd: 1.0
online_replay_mode: mixed
offline_data_ratio: 0.5

bootstrap_at_done: truncated

use_cql_loss: true
online_use_cql_loss: true

actor_use_layer_norm: true
critic_use_layer_norm: true

policy_lr: 0.0003
q_lr: 0.0003
alpha_lr: 0.0003
cql_alpha_lr: 0.0003
policy_frequency: 1
target_network_frequency: 1

num_eval_episodes: 20
eval_episode_horizon: 200
eval_freq: 0
offline_eval_freq: 10000
online_eval_freq: 10000

capture_video: false
log_type: wandb
checkpoint_freq: 50000
seed: 0
