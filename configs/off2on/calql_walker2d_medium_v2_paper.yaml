# Cal-QL on Walker2d-Medium-v2 (D4RL locomotion). Same reconciliation as
# calql_halfcheetah_medium_v2_paper.yaml -- see that file's header for the
# full source list and rationale (WSRL's official locomotion_cql config +
# rl-garden's own opt-in SARSA/FQE reference for the MC-return truncation
# bias on this continuing-task domain).
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: walker2d-medium-v2
offline_dataset: walker2d-medium-v2
num_envs: 1
num_eval_envs: 1

num_offline_steps: 250000
num_online_steps: 500000
batch_size: 256
buffer_size: 2000000
training_freq: 1
utd: 1.0
online_replay_mode: mixed
offline_data_ratio: 0.5

use_sarsa_reference: true
sarsa_hidden_dims: [256, 256]
sarsa_lr: 0.0003

hidden_dim: 256
actor_hidden_layers: 2
critic_hidden_layers: 2
kernel_init: orthogonal_near_zero_output

n_critics: 2
actor_use_layer_norm: false
critic_use_layer_norm: false
bootstrap_at_done: truncated

use_cql_loss: true
cql_alpha: 5.0
online_cql_alpha: 5.0
online_use_cql_loss: true

policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
cql_alpha_lr: 0.0003
policy_frequency: 1
target_network_frequency: 1

num_eval_episodes: 10
eval_episode_horizon: 1000
eval_freq: 0
offline_eval_freq: 25000
online_eval_freq: 25000

capture_video: false
log_type: wandb
checkpoint_freq: 200000
seed: 0
