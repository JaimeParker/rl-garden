# IQL on Door-Binary-v0 (D4RL legacy, Cal-QL's own sparse Adroit variant).
# See iql_pen_binary_v0_paper.yaml for the full source reconciliation
# (WSRL's official adroit_iql config + the already-validated
# calql_door_binary_v0_paper.yaml's reward/budget/eval-horizon contract).
env_backend: d4rl_legacy
dataset_backend: h5
env_id: door-binary-v0
offline_dataset: null
obs_mode: state
num_envs: 1
num_eval_envs: 1

num_offline_steps: 20000
num_online_steps: 1000000
batch_size: 256
buffer_size: 2000000
training_freq: 1
utd: 1.0
online_replay_mode: mixed
offline_data_ratio: 0.5

reward_scale: 10.0
reward_bias: 5.0

expectile: 0.7
temperature: 0.5
actor_lr: 0.0003
critic_value_lr: 0.0003
actor_distribution: unsquashed
std_parameterization: uniform
actor_dropout_rate: 0.1

n_critics: 2
critic_subsample_size: 2
actor_use_layer_norm: false
critic_use_layer_norm: false
value_use_layer_norm: false
bootstrap_at_done: truncated

num_eval_episodes: 20
eval_episode_horizon: 200
eval_freq: 0
offline_eval_freq: 2000
online_eval_freq: 2000

capture_video: false
log_type: wandb
seed: 0
