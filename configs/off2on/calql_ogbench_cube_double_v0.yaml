env_backend: ogbench
dataset_backend: ogbench
env_id: cube-double-singletask-v0
offline_dataset: cube-double-play-singletask-v0
num_envs: 4
num_eval_envs: 2

num_offline_steps: 1000000
num_online_steps: 0
batch_size: 256
buffer_size: 1000000
training_freq: 1
utd: 1.0
online_replay_mode: mixed
offline_data_ratio: 0.5

bootstrap_at_done: truncated

use_cql_loss: true
online_use_cql_loss: true

actor_use_layer_norm: true
critic_use_layer_norm: true

reward_scale: 1.0
reward_bias: 0.0

policy_lr: 0.0003
q_lr: 0.0003
alpha_lr: 0.0003
cql_alpha_lr: 0.0003
policy_frequency: 1
target_network_frequency: 1

num_eval_episodes: 20
eval_episode_horizon: 500
eval_freq: 0
offline_eval_freq: 10000
online_eval_freq: 10000

capture_video: false
log_type: wandb
checkpoint_freq: 50000
seed: 0
