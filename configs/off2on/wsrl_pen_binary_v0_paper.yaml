# WSRL on Pen-Binary-v0 (D4RL legacy, Cal-QL's own sparse Adroit variant).
# Parameters reconciled from two sources: (1) rl-garden's own proven Cal-QL
# adroit-binary recipe (configs/off2on/calql_pen_binary_v0_paper.yaml) for
# reward/dataset/budget, (2) WSRL's official JAX repo (3rd_party/wsrl):
# offline pretrain = experiments/scripts/adroit/launch_calql_finetune.sh,
# online fine-tune = launch_wsrl_finetune.sh (agent=sac, resumed from the
# offline checkpoint, no data retention).
#
# Unlike AntMaze/Kitchen, official adroit_cql (offline) does NOT itself set
# use_layer_norm/critic_ensemble_size -- but the official README's own usage
# example explicitly runs Adroit's offline stage with --use_redq
# (`bash experiments/scripts/adroit/launch_calql_finetune.sh --use_redq
# --env door-binary-v0`), and wsrl_config.py's own get_wsrl_config() base
# (used by adroit_wsrl for the online phase) unconditionally sets
# critic_ensemble_size=10/critic_subsample_size=2/use_layer_norm=True
# regardless of --use_redq. So both phases of WSRL's own Adroit recipe use
# the REDQ+LayerNorm architecture below -- this is WSRL's own warm-start
# recipe, deliberately stronger than the plain Cal-QL paper's own
# calql_pen_binary_v0_paper.yaml (n_critics=2, no LayerNorm), the same
# distinction already established for wsrl_antmaze_*_paper.yaml.
# std_parameterization=exp and kernel_init (translating official
# kernel_scale_final=1e-2) follow adroit_wsrl/adroit_cql's own arch, not
# antmaze's uniform/orthogonal_near_zero_output choice for the same reason
# (adroit_wsrl explicitly restates std_parameterization="exp", matching
# sac_config.py's own base -- unlike antmaze_wsrl, which overrides to
# "uniform").
#
# cql_autotune_alpha stays at its (default) false: neither adroit_cql nor
# cql_config.py's own base enables it for this domain, so the CQL-Lagrange
# field gap that broke wsrl_antmaze_*_paper.yaml's offline pretraining does
# not apply here (fixed cql_alpha, no autotuned dual variable, no
# cql_diff_clip_mode interaction) -- confirmed against
# 3rd_party/wsrl/experiments/configs/cql_config.py.
env_backend: d4rl_legacy
dataset_backend: h5
env_id: pen-binary-v0
offline_dataset: null
obs_mode: state
num_envs: 1
num_eval_envs: 1

num_offline_steps: 20000
num_online_steps: 300000
utd: 4.0
batch_size: 1024
buffer_size: 2000000
warmup_steps: 5000

reward_scale: 10.0
reward_bias: 5.0
sparse_reward_mc: true
sparse_negative_reward: -5.0
success_threshold: 0.5

# Architecture: WSRL's own adroit recipe (2-layer actor, 3-layer critic,
# 512-wide, exp std parameterization) -- matches the official repo's
# train_config.py:adroit_wsrl/adroit_cql exactly.
hidden_dim: 512
actor_hidden_layers: 2
critic_hidden_layers: 3
std_parameterization: exp
kernel_init: orthogonal_near_zero_output

# REDQ ensemble + LayerNorm: wsrl_config.py's own unconditional base for the
# WSRL agent (see header). Listed explicitly since structurally load-bearing.
n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
backup_entropy: false
target_entropy: 0.0
bootstrap_at_done: truncated

# Offline CQL/Cal-QL pretraining, matching calql_pen_binary_v0_paper.yaml's
# already-validated fixed (non-autotuned) alpha.
use_cql_loss: true
cql_alpha: 1.0
cql_importance_sample: true
cql_max_target_backup: true
cql_clip_diff_min: -200.0
cql_clip_diff_max: 200.0

# Online phase: WSRL's defining behavior -- no data retention, no CQL
# penalty online (already WSRLOff2OnArgs's own defaults: online_replay_mode
# empty, offline_data_ratio 0.0, online_use_cql_loss false). Listed
# explicitly for documentation.
online_replay_mode: empty
offline_data_ratio: 0.0
online_cql_alpha: 0.0
online_use_cql_loss: false

policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
cql_alpha_lr: 0.0003
policy_frequency: 1
target_network_frequency: 1

# WSRLOff2OnArgs has no num_eval_episodes/eval_episode_horizon derivation
# (that's CalQL-only) -- set the step budget directly: 20 episodes x
# 100-step horizon, matching calql_pen_binary_v0_paper.yaml's eval contract.
num_eval_steps: 2000
eval_freq: 0
offline_eval_freq: 2000
online_eval_freq: 2000

capture_video: false
log_type: wandb
seed: 0
