# IQL on Pen-Binary-v0 (D4RL legacy, Cal-QL's own sparse Adroit variant).
# Reward transform, dataset backend, and training budget matched to the
# already-validated calql_pen_binary_v0_paper.yaml (same domain, same reward
# contract, cross-algorithm comparability per PLAN-005's core method matrix).
# expectile/temperature matched to WSRL's official JAX repo adroit_iql config
# (3rd_party/wsrl/experiments/configs/train_config.py). hidden_dims=(256,256)
# is already rl-garden's own default (no override needed -- same finding as
# iql_kitchen_*_paper.yaml). tanh_squash_distribution=False/
# std_parameterization=uniform are official IQL's global hardcoded choices,
# not domain-specific (see docs/design/iql-overview.md). actor_dropout_rate
# matches adroit_iql's explicit dropout_rate=0.1 override. actor_lr/
# critic_value_lr left at official IQL's own base default (3e-4/3e-4,
# matching iql_kitchen_*_paper.yaml) since adroit_iql doesn't override them.
# kernel_init_type="var_scaling" (official adroit_iql) has no equivalent
# rl-garden option and is left unset, matching the iql_antmaze/iql_kitchen
# precedent of not chasing every JAX-specific initializer.
env_backend: d4rl_legacy
dataset_backend: h5
env_id: pen-binary-v0
offline_dataset: null
obs_mode: state
num_envs: 1
num_eval_envs: 1

num_offline_steps: 20000
num_online_steps: 300000
batch_size: 256
buffer_size: 2000000
training_freq: 1
utd: 1.0
online_replay_mode: mixed
offline_data_ratio: 0.5

reward_scale: 10.0
reward_bias: 5.0

expectile: 0.7
temperature: 0.5
actor_lr: 0.0003
critic_value_lr: 0.0003
actor_distribution: unsquashed
std_parameterization: uniform
actor_dropout_rate: 0.1

n_critics: 2
critic_subsample_size: 2
actor_use_layer_norm: false
critic_use_layer_norm: false
value_use_layer_norm: false
bootstrap_at_done: truncated

num_eval_episodes: 20
eval_episode_horizon: 100
eval_freq: 0
offline_eval_freq: 2000
online_eval_freq: 2000

capture_video: false
log_type: wandb
seed: 0
