# Cal-QL on HalfCheetah-Medium-v2 (D4RL locomotion, continuing task, dense
# reward). No official Cal-QL paper hyperparameters exist for this task
# family (paper Table 3 only covers AntMaze/Kitchen/Adroit); reconciled
# instead from WSRL's own official JAX repo locomotion_cql config
# (3rd_party/wsrl/experiments/configs/train_config.py:locomotion_cql, which
# resolves through cql_config.py -> sac_config.py): hidden_dims=[256,256],
# kernel_scale_final=1e-2, cql_alpha=5.0, online_cql_alpha=5.0, and
# sac_config.py's own critic_ensemble_size=2 default (no LayerNorm
# override) -- i.e. Cal-QL's usual lighter architecture, not WSRL/RLPD's
# heavier REDQ+LayerNorm locomotion_wsrl recipe.
#
# use_sarsa_reference=true is rl-garden's own opt-in addition (not part of
# WSRL's official recipe): D4RL locomotion has no true terminal, so the
# default MC-return calibration used by Cal-QL's CalQL lower bound is
# systematically biased low at every 1000-step timeout chunk boundary (see
# d4rl_legacy_dataset.py's own RuntimeWarning). The SARSA/FQE reference
# network (rl_garden/algorithms/calql.py) fixes this via TD bootstrap
# instead of truncated MC sum -- verified on real halfcheetah-medium-v2
# data (see ExpNote runs qlefoyu2/hx5khjv8: same config/seed, SARSA-off vs
# SARSA-on, 1M offline steps, no regression). This is why PLAN-005 treats
# rl-garden's Cal-QL locomotion support as real but not a faithful paper
# reproduction claim.
#
# num_offline_steps/num_online_steps (250k/500k), online_replay_mode=mixed
# and offline_data_ratio=0.5 match this domain's own
# iql_halfcheetah_medium_v2_paper.yaml and rlpd_halfcheetah_medium_v2_wsrl.yaml
# for cross-algorithm comparability -- deliberately NOT the 1M-offline-only
# calibration budget used by configs/offline/calql_halfcheetah_medium_v2.yaml
# (qlefoyu2/hx5khjv8), which never had an online phase. online_cql_alpha=5.0
# and online_use_cql_loss=true continue the conservative loss online,
# matching Cal-QL's canonical PLAN-005 role ("retained offline replay；继续
# conservative loss") and the official locomotion_cql recipe -- unlike
# WSRL's own stripped no-retention/no-CQL online phase for this domain.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: halfcheetah-medium-v2
offline_dataset: halfcheetah-medium-v2
num_envs: 1
num_eval_envs: 1

num_offline_steps: 250000
num_online_steps: 500000
batch_size: 256
buffer_size: 2000000
training_freq: 1
utd: 1.0
online_replay_mode: mixed
offline_data_ratio: 0.5

use_sarsa_reference: true
sarsa_hidden_dims: [256, 256]
sarsa_lr: 0.0003

hidden_dim: 256
actor_hidden_layers: 2
critic_hidden_layers: 2
kernel_init: orthogonal_near_zero_output

n_critics: 2
actor_use_layer_norm: false
critic_use_layer_norm: false
bootstrap_at_done: truncated

use_cql_loss: true
cql_alpha: 5.0
online_cql_alpha: 5.0
online_use_cql_loss: true

policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
cql_alpha_lr: 0.0003
policy_frequency: 1
target_network_frequency: 1

num_eval_episodes: 10
eval_episode_horizon: 1000
eval_freq: 0
offline_eval_freq: 25000
online_eval_freq: 25000

capture_video: false
log_type: wandb
checkpoint_freq: 200000
seed: 0
