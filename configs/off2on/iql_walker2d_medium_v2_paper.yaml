# IQL on Walker2d-Medium-v2 (D4RL locomotion, continuing task, dense
# reward -- see calql_halfcheetah_medium_v2.yaml, this domain's shared
# reference config, for the contract: d4rl_legacy backend, no reward
# transform, 1000-step eval horizon).
# expectile/temperature matched to WSRL's official JAX repo locomotion_iql
# config (3rd_party/wsrl/experiments/configs/train_config.py); both values
# are already rl-garden's own OfflineIQLArgs defaults, kept explicit for
# parity with the other iql_*_paper.yaml configs. actor_distribution=
# unsquashed/std_parameterization=uniform are official IQL's global
# hardcoded choices, not domain-specific (see iql_pen_binary_v0_paper.yaml).
# No dropout override -- locomotion_iql doesn't set one, unlike adroit_iql's
# 0.1. num_offline_steps/num_online_steps (250k/500k) match WSRL's own
# locomotion launch_iql_finetune.sh
# (3rd_party/wsrl/experiments/scripts/locomotion/) and finetune.py's own
# unmodified num_online_steps default. offline_data_ratio=0.5 matches this
# project's cross-algorithm mixing convention (same as the companion
# rlpd_walker2d_medium_v2_wsrl.yaml), for comparability with RLPD.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: walker2d-medium-v2
offline_dataset: walker2d-medium-v2
obs_mode: state
num_envs: 1
num_eval_envs: 1

num_offline_steps: 250000
num_online_steps: 500000
batch_size: 256
buffer_size: 2000000
training_freq: 1
utd: 1.0
online_replay_mode: mixed
offline_data_ratio: 0.5

expectile: 0.7
temperature: 3.0
actor_lr: 0.0003
critic_value_lr: 0.0003
actor_distribution: unsquashed
std_parameterization: uniform

n_critics: 2
critic_subsample_size: 2
actor_use_layer_norm: false
critic_use_layer_norm: false
value_use_layer_norm: false
bootstrap_at_done: truncated

num_eval_episodes: 10
eval_episode_horizon: 1000
eval_freq: 0
offline_eval_freq: 25000
online_eval_freq: 25000

capture_video: false
log_type: wandb
checkpoint_freq: 200000
seed: 0
