# RLPD on Walker2d-Medium-v2 (D4RL locomotion), aligned to WSRL's own
# RLPD locomotion baseline:
# 3rd_party/wsrl/experiments/scripts/locomotion/launch_rlpd.sh (--agent sac
# --config train_config.py:locomotion_wsrl), which resolves through
# wsrl_config.py -> sac_config.py with locomotion_wsrl's smaller [256,256]
# critic/policy networks (not adroit_wsrl's [512,512,512]/[512,512] -- see
# rlpd_pen_binary_v0_wsrl.yaml for that domain's larger-network
# reconciliation). No reward transform, matching this domain's own contract
# (calql_halfcheetah_medium_v2.yaml, this domain's shared reference config,
# carries none either, unlike Adroit's
# sparse 10.0/5.0). total_timesteps/offline_data_ratio/utd/batch_size match
# launch_rlpd.sh's flags and WSRL's own unmodified num_online_steps default
# (500k), also matching the companion iql_walker2d_medium_v2_paper.yaml's
# online budget for cross-algorithm comparability.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: walker2d-medium-v2
offline_dataset: walker2d-medium-v2
obs_mode: state
num_envs: 1
num_eval_envs: 1

offline_data_ratio: 0.5
offline_buffer_size: 2000000

total_timesteps: 500000
learning_starts: 5000
training_freq: 1
utd: 4.0
batch_size: 1024
buffer_size: 1000000
gamma: 0.99
tau: 0.005
policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
target_entropy: 0.0

n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
hidden_dim: 256
actor_hidden_layers: 2
critic_hidden_layers: 2
std_parameterization: exp
kernel_init: orthogonal_near_zero_output

capture_video: false
log_type: wandb
eval_freq: 25000
num_eval_steps: 10000
checkpoint_freq: 200000
seed: 0
