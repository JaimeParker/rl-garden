env_backend: robotwin
env_id: place_empty_cup
robotwin:
  head_camera_type: Train_D435_128x96
  step_lim: 200
  embodiment: [piper, piper, 0.6]
  reward_mode: dense
  control_step_cap: 16
obs:
  rgb: [head]
  image_size: [64, 64]
num_envs: 4
num_eval_envs: 2
total_timesteps: 1000000
num_steps: 16
encoder:
  backbone: plain_conv
  image_fusion_mode: per_key
control_mode: delta_joint_pos
