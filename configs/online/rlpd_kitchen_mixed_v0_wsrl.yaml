# RLPD on Kitchen-Mixed-v0 (D4RL legacy). Same reconciliation as
# rlpd_kitchen_partial_v0_wsrl.yaml -- see that file's header for the full
# source list and rationale.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: kitchen-mixed-v0
offline_dataset: kitchen-mixed-v0
num_envs: 1
num_eval_envs: 1

reward_scale: 1.0
reward_bias: -4.0
offline_data_ratio: 0.5
offline_buffer_size: 2000000

total_timesteps: 500000
learning_starts: 5000
training_freq: 1
utd: 4.0
batch_size: 1024
buffer_size: 1000000
gamma: 0.99
tau: 0.005
policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
target_entropy: 0.0

n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
hidden_dim: 512
actor_hidden_layers: 3
critic_hidden_layers: 3
std_parameterization: exp
bootstrap_at_done: truncated

capture_video: false
log_type: wandb
eval_freq: 2000
num_eval_steps: 20000
seed: 0
