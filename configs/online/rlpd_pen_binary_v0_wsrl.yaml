# RLPD on Pen-Binary-v0 (D4RL legacy, Cal-QL's own sparse Adroit variant),
# aligned to WSRL's own RLPD baseline:
# 3rd_party/wsrl/experiments/scripts/adroit/launch_rlpd.sh (--agent sac
# --config train_config.py:adroit_wsrl), which resolves through
# wsrl_config.py -> sac_config.py -- the same config object WSRL's own
# online phase uses, so architecture matches wsrl_pen_binary_v0_paper.yaml
# exactly (see that file's header for the REDQ/LayerNorm/std_parameterization
# reconciliation). Reward transform and total online budget matched to the
# already-validated calql_pen_binary_v0_paper.yaml for cross-algorithm
# comparability. offline_data_ratio/warmup_steps/utd/batch_size match the
# official launch_rlpd.sh flags exactly.
env_backend: d4rl_legacy
dataset_backend: h5
env_id: pen-binary-v0
offline_dataset: null
obs_mode: state
num_envs: 1
num_eval_envs: 1

reward_scale: 10.0
reward_bias: 5.0
offline_data_ratio: 0.5
offline_buffer_size: 2000000

total_timesteps: 300000
learning_starts: 5000
training_freq: 1
utd: 4.0
batch_size: 1024
buffer_size: 1000000
gamma: 0.99
tau: 0.005
policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
target_entropy: 0.0

n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
hidden_dim: 512
actor_hidden_layers: 2
critic_hidden_layers: 3
std_parameterization: exp
kernel_init: orthogonal_near_zero_output

capture_video: false
log_type: wandb
eval_freq: 2000
num_eval_steps: 2000
seed: 0
