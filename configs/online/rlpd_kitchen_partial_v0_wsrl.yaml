# RLPD on Kitchen-Partial-v0 (D4RL legacy), aligned to WSRL's own RLPD
# Kitchen baseline: 3rd_party/wsrl/experiments/scripts/kitchen/launch_rlpd.sh
# (--agent sac --config train_config.py:kitchen_wsrl --num_offline_steps 0
# --offline_data_ratio 0.5 --reward_scale 1.0 --reward_bias -4.0 --utd 4
# --batch_size 1024 --warmup_steps 5_000), which resolves through
# wsrl_config.py -> sac_config.py with kitchen_wsrl's own architecture
# (512x3 hidden, LayerNorm everywhere, exp std parameterization) -- matches
# this repo's own wsrl_kitchen_partial_v0_paper.yaml exactly (already
# validated this session: target_entropy=auto reaches normalized_score=100).
# reward_bias=-4.0 matches the official script and this repo's existing
# Kitchen domain convention (one reward contract per domain, per
# wsrl_kitchen_partial_v0_paper.yaml's own header/ANA-004 reconciliation).
# total_timesteps=500,000 matches wsrl_kitchen_partial_v0_paper.yaml's own
# num_online_steps for cross-algorithm comparability. No kernel_init
# override -- kitchen_wsrl doesn't set kernel_scale_final either, unlike
# antmaze_wsrl/locomotion_wsrl (same reasoning as the existing WSRL Kitchen
# configs). warmup_steps is omitted, matching every other rlpd_*_wsrl.yaml
# in this repo -- RLPD starts from scratch with offline data already mixed
# in, so it has no warm-start policy-initialization shock to guard against.
# bootstrap_at_done=truncated is required for the Kitchen success-
# termination wrapper (_KitchenTerminalWrapper,
# rl_garden/envs/d4rl_legacy/env.py) to matter -- same requirement as the
# Cal-QL/WSRL Kitchen configs.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: kitchen-partial-v0
offline_dataset: kitchen-partial-v0
num_envs: 1
num_eval_envs: 1

reward_scale: 1.0
reward_bias: -4.0
offline_data_ratio: 0.5
offline_buffer_size: 2000000

total_timesteps: 500000
learning_starts: 5000
training_freq: 1
utd: 4.0
batch_size: 1024
buffer_size: 1000000
gamma: 0.99
tau: 0.005
policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
target_entropy: 0.0

n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
hidden_dim: 512
actor_hidden_layers: 3
critic_hidden_layers: 3
std_parameterization: exp
bootstrap_at_done: truncated

capture_video: false
log_type: wandb
eval_freq: 2000
num_eval_steps: 20000
seed: 0
