# RLPD on Door-Binary-v0 (D4RL legacy, Cal-QL's own sparse Adroit variant).
# See rlpd_pen_binary_v0_wsrl.yaml for the full source reconciliation
# (WSRL's official launch_rlpd.sh/adroit_wsrl config + the already-validated
# calql_door_binary_v0_paper.yaml's reward/budget/eval-horizon contract).
env_backend: d4rl_legacy
dataset_backend: h5
env_id: door-binary-v0
offline_dataset: null
obs_mode: state
num_envs: 1
num_eval_envs: 1

reward_scale: 10.0
reward_bias: 5.0
offline_data_ratio: 0.5
offline_buffer_size: 2000000

total_timesteps: 1000000
learning_starts: 5000
training_freq: 1
utd: 4.0
batch_size: 1024
buffer_size: 1000000
gamma: 0.99
tau: 0.005
policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
target_entropy: 0.0

n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
hidden_dim: 512
actor_hidden_layers: 2
critic_hidden_layers: 3
std_parameterization: exp
kernel_init: orthogonal_near_zero_output

capture_video: false
log_type: wandb
eval_freq: 2000
num_eval_steps: 4000
seed: 0
