# RLPD on AntMaze-Large-Diverse-v2 (D4RL legacy), aligned to WSRL's own RLPD
# baseline: 3rd_party/wsrl/experiments/scripts/antmaze/launch_rlpd.sh
# (--agent sac --config train_config.py:antmaze_wsrl), which resolves through
# wsrl_config.py -> sac_config.py. See ANA-004/PLAN-004 for the full
# parameter-by-parameter comparison against this file.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: antmaze-large-diverse-v2
offline_dataset: antmaze-large-diverse-v2
obs_mode: state
num_envs: 1
num_eval_envs: 1

reward_scale: 10.0
reward_bias: -5.0
offline_data_ratio: 0.5
offline_buffer_size: 1200000

total_timesteps: 500000
learning_starts: 5000
training_freq: 1
utd: 4.0
batch_size: 1024
buffer_size: 1000000
gamma: 0.99
tau: 0.005
policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
target_entropy: 0.0

n_critics: 10
critic_subsample_size: 1
actor_use_layer_norm: true
critic_use_layer_norm: true
hidden_dim: 256
actor_hidden_layers: 2
critic_hidden_layers: 4
std_parameterization: uniform
kernel_init: orthogonal_near_zero_output

capture_video: false
log_type: wandb
eval_freq: 5000
num_eval_steps: 2000
seed: 0
