[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_garden"
version = "0.0.1"
description = "SB3-style, GPU-parallel SAC framework built for ManiSkill, with hil-serl ResNet encoders."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "gymnasium>=0.29",
    "numpy",
    "einops",
    "tyro",
    "tensorboard",
    "tqdm",
    "h5py",
    "pyyaml",
]

[project.optional-dependencies]
maniskill = ["mani_skill"]
robotwin = ["pillow", "pyyaml"]
# [hf] is required to actually download a hosted dataset (minari.load_dataset(...,
# download=True)) -- confirmed by reproducing the failure end to end: plain
# `pip install minari` raises "ImportError: huggingface_hub is not installed"
# the first time a real download is attempted.
minari = ["minari[hf]", "gymnasium-robotics"]
d4rl-legacy = [
    "gym==0.23.1",
    "mujoco-py==2.1.2.14",
    "d4rl @ git+https://github.com/nakamotoo/D4RL.git@d234792d5562b738b12b78e9074a2d6c7e23b01f",
]
# PyPI's "robomimic" is stuck at 0.3.0 (pre-HuggingFace, no HF_REPO_ID/
# DATASET_REGISTRY HF migration) -- pin to the v0.5.0 git tag for the
# HuggingFace-hosted dataset registry this backend's download docs assume.
# Confirmed by installing plain PyPI robomimic and checking directly:
# has DATASET_REGISTRY=True but HF_REPO_ID=False on 0.3.0.
robomimic = [
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.5.0",
    "robosuite",
    # Published robosuite==1.5.2's own metadata only pins mujoco>=3.3.0 (no
    # upper bound); robosuite's GitHub main has since added mujoco<3.10
    # ("3.10 changed mj_fullM signature; breaks controllers/parts/
    # controller.py"). Without this pin, plain `pip install robosuite`
    # grabs the newest mujoco and fails constructing any robosuite env
    # (AssertionError in binding_utils.get_joint_qpos_addr, confirmed by
    # reproducing it end to end against mujoco 3.12.0).
    "mujoco>=3.3.0,<3.10",
]
d4rl-legacy-manip = [
    "gym==0.23.1",
    "numpy==1.23.5",
    "scipy==1.10.1",
    "Cython==0.29.37",
    "mujoco-py==2.1.2.14",
    "dm-control==1.0.14",
    "mujoco==2.3.7",
    "six==1.17.0",
    "termcolor==2.5.0",
    "mjrl @ git+https://github.com/aravindr93/mjrl.git@3871d93763d3b49c4741e6daeaebbc605fe140dc",
    "d4rl @ git+https://github.com/nakamotoo/D4RL.git@d234792d5562b738b12b78e9074a2d6c7e23b01f",
]
ogbench = ["ogbench"]
metaworld = ["metaworld"]
wandb = ["wandb"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["rl_garden*"]
exclude = ["3rd_party*", "tests*", "examples*", "robot_infra*"]
