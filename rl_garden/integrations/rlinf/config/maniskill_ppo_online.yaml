# Starting point for RLGardenPPOFSDPActor/RLGardenPPORollout, trimmed from
# RLinf's own examples/embodiment/config/maniskill_ppo_mlp.yaml
# (read-only reference, not edited). Unlike maniskill_sac_online.yaml, this
# adapter goes through RLinf's own model registry/FSDP machinery
# (docs/design/rlinf-integration.md, Phase 3) -- reuses
# hybrid_engines/fsdp@actor.fsdp_config and weight_syncer/patch_syncer@
# weight_syncer as defaults rather than hand-writing them, matching the
# reference config's own convention. Does NOT reuse model/mlp_policy@
# actor.model: that default group configures RLinf's own MLPPolicy
# constructor args, not ours -- actor.model is hand-written below, same
# convention Phase 2 already used for its own actor.model block.
#
# obs_dim/action_dim/control_mode verified 2026-08-17 against a real
# gym.make("PickCube-v1", obs_mode="state", control_mode="pd_ee_delta_pos")
# (see maniskill_sac_online.yaml's header note and .agents/local/6017.md):
# obs shape (N, 42), action_space Box(-1, 1, (N, 4)) -- pd_ee_delta_pos is a
# 4-DoF end-effector-delta control mode (3D position delta + 1 gripper
# dim), not 7-DoF joint control.

defaults:
  - env/maniskill_pick_cube@env.train
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "rlgarden_maniskill_ppo_online"
    logger_backends: ["tensorboard"]

  max_epochs: 1000000
  max_steps: -1

  only_eval: False
  # eval disabled for bring-up (Phase 1/2 precedent: smallest possible
  # foothold first).
  val_check_interval: -1
  save_interval: -1

  # Bare-attribute read in EmbodiedRunner.__init__ (no .get() fallback),
  # normally populated by validate_cfg, which this adapter's entry script
  # skips -- must be set explicitly or construction raises.
  weight_sync_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  normalize_advantages: True
  loss_type: actor_critic
  # adv_type selects RLinf's own stock "gae" registry entry, which
  # RLGardenPPOFSDPActor.compute_advantages_and_returns then bypasses
  # directly (auto-reset-correct GAE, see ppo_actor.py) -- kept as "gae"
  # for documentation/consistency, not because the registry dispatch is
  # actually reached (overwriting the registry key for a custom kind
  # doesn't work, see docs/design/rlinf-integration.md's reasoning).
  adv_type: gae
  loss_agg_func: "token-mean"

  # Bare-attribute reads in EmbodiedFSDPActor.train_micro_batch (no
  # .get() fallback) -- reference config (maniskill_ppo_mlp.yaml) sets
  # all four; entropy_bonus: 0 additionally means entropy_type is never
  # actually read (guarded behind `entropy_bonus > 0`), kept anyway for
  # parity/documentation in case entropy_bonus is ever turned on later.
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  entropy_bonus: 0

  # [standard, always]. "standard" only bootstraps on truncation; "always"
  # bootstraps on truncation or termination too. rl-garden's own GAE
  # (compute_gae) always distinguishes true termination (via `dones`,
  # sourced from `terminations` below) from truncation for the value
  # target, matching "always" semantics.
  bootstrap_type: always
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    # Normally defaulted to 1 by validate_cfg (rlinf/config.py:897-900),
    # which this adapter skips -- set explicitly.
    rollout_epoch: 1
    init_params:
      control_mode: "pd_ee_delta_pos"  # verified valid, see header note

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  # BasePolicy's default enable_torch_compile/capture_cuda_graph stubs
  # raise NotImplementedError -- the reference config enables both for
  # RLinf's own MLPPolicy, which implements them; RLGardenPPOModel does
  # not, so both must be disabled here.
  enable_torch_compile: False
  enable_cuda_graph: False

  # Required for RLGardenPPOFSDPActor.compute_advantages_and_returns'
  # auto-reset bootstrap fix: populates Trajectory.next_obs (default False,
  # env_worker.py:77).
  collect_transitions: True

  model:
    model_path: ""
    precision: "32"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  seed: 1234
  enable_offload: False
  # global_batch_size % (micro_batch_size * actor_world_size) == 0 is
  # asserted directly inside EmbodiedFSDPActor.__init__ itself
  # (fsdp_actor_worker.py:1097-1101) -- not skippable by avoiding
  # validate_cfg. Single actor rank, single-node bring-up: both equal the
  # full rollout batch (total_num_envs * max_steps_per_rollout_epoch).
  micro_batch_size: 400
  global_batch_size: 400

  model:
    model_path: ""
    # Selects the builder registered by ppo_model.register_rl_garden_ppo_model.
    model_type: "rl_garden_ppo"
    precision: "32"
    # get_model() reads cfg.is_lora unconditionally
    # (rlinf/models/__init__.py) -- raises ConfigAttributeError if absent.
    is_lora: False
    add_value_head: True
    obs_dim: 42  # verified, see header note
    action_dim: 4  # verified, see header note (pd_ee_delta_pos is 4-DoF)
    num_action_chunks: 1
    # prepare_actions_for_maniskill (rlinf/envs/action_utils.py) does
    # `if "panda" in policy: return raw_chunk_actions` -- with
    # policy_setup unset, model_cfg.get("policy_setup", None) is None and
    # `"panda" in None` raises TypeError. Any value containing "panda"
    # selects the passthrough branch, which is what we want:
    # RLGardenPPOModel already emits raw ManiSkill-ready actions, no
    # VLA-style reformatting needed. Same convention as
    # maniskill_sac_online.yaml.
    policy_setup: "panda_wristcam"
    # Passed through to PPOPolicy's constructor via
    # ppo_model.build_policy_from_cfg -- any of its normal keyword
    # arguments are valid here.
    rlgarden_policy: "ppo"
    rlgarden_policy_kwargs: {}

  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 0.5

  # Overrides the hybrid_engines/fsdp@actor.fsdp_config default (full_shard)
  # for single-node bring-up, matching Phase 2's precedent and the
  # reference config's own default.
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
