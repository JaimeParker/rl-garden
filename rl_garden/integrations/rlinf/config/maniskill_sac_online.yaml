# Starting point for RLGardenSACActor/RLGardenSACRollout, trimmed from
# RLinf's own 3rd_party/RLinf/examples/embodiment/config/
# maniskill_sac_mlp_async.yaml (read-only reference, not edited).
#
# Reuses env/maniskill_pick_cube@env.train unmodified for wrap_obs_mode:
# simple + init_params.obs_mode: state (RLinf's own defaults already give
# state-based, non-visual observations -- see
# docs/design/rlinf-integration.md's ManiSkill finding).
#
# obs_dim/action_dim/control_mode verified 2026-08-17 against a real
# `gym.make("PickCube-v1", obs_mode="state", control_mode="pd_ee_delta_pos")`
# on 6017 (.agents/local/6017.md): obs shape (N, 42), action_space Box(-1, 1,
# (N, 4)) -- pd_ee_delta_pos is a 4-DoF end-effector-delta control mode (3D
# position delta + 1 gripper dim), not 7-DoF joint control.

defaults:
  - env/maniskill_pick_cube@env.train
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "rlgarden_maniskill_sac_online"
    logger_backends: ["tensorboard"]

  max_epochs: 1000000
  max_steps: -1

  only_eval: False
  # eval disabled for bring-up (Phase 1 precedent: smallest possible
  # foothold first). Turning this on requires env.eval + rollout.evaluate
  # wiring, out of scope for the first verification tier.
  val_check_interval: -1
  save_interval: -1

  # Bare-attribute read in EmbodiedRunner.__init__ (no .get() fallback),
  # normally populated by validate_cfg, which this adapter's entry script
  # skips -- must be set explicitly or construction raises. 1 = sync
  # weights to the rollout worker every training step; safest default for
  # bring-up, not tuned for throughput.
  weight_sync_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  # Only the replay-buffer block is actually read by this adapter
  # (rl_garden/integrations/rlinf/sac_actor.py's init_worker) -- RLinf's
  # own loss_type/adv_type/entropy_tuning/gamma/tau fields below are unused
  # here (rl-garden's own SAC/RLPD hyperparameters come from
  # actor.model.rlgarden_algorithm_kwargs instead) but kept present in case
  # other RLinf internals read them unconditionally; harmless if unused.
  loss_type: embodied_sac
  adv_type: embodied_sac

  replay_buffer:
    enable_cache: True
    cache_size: 10000
    sample_window_size: 10000
    min_buffer_size: 100
    auto_save: False

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    # Normally defaulted to 1 by validate_cfg (rlinf/config.py:898), which
    # this adapter skips (see train_sac.py docstring) -- set explicitly so
    # EnvWorker.__init__'s bare `train_env_cfg.rollout_epoch` read doesn't
    # raise.
    rollout_epoch: 1
    init_params:
      control_mode: "pd_ee_delta_pos"  # verified valid, see header note

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  enable_cuda_graph: False
  enable_torch_compile: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: ""
    precision: "32"

actor:
  group_name: "ActorGroup"
  seed: 1234
  # Not FSDP -- RLGardenSACActor builds its own rl-garden SAC/RLPD
  # optimizers directly (rl_garden/integrations/rlinf/sac_actor.py). No
  # actor.optim/critic_optim/fsdp_config block: those configure RLinf's own
  # FSDP actor, which this adapter deliberately does not subclass.
  recv_drain_max_trajectories: 1024

  model:
    # RLinf's own EnvWorker.env_interact_step reads model_cfg.model_type
    # unconditionally (rlinf/workers/env/env_worker.py) to select
    # env-specific action formatting in prepare_actions(); for
    # env_type=maniskill that formatting (prepare_actions_for_maniskill)
    # never actually consumes model_type, so any placeholder avoids the
    # ConfigAttributeError without affecting behavior -- not one of
    # RLinf's own SupportedModel values, and doesn't need to be.
    model_type: "rl_garden_sac"
    # prepare_actions_for_maniskill (rlinf/envs/action_utils.py) does
    # `if "panda" in policy: return raw_chunk_actions` -- with policy_setup
    # unset, model_cfg.get("policy_setup", None) is None and `"panda" in
    # None` raises TypeError. Any value containing "panda" selects the
    # passthrough branch, which is what we want: RLGardenSACRollout already
    # emits raw ManiSkill-ready actions, no VLA-style reformatting needed.
    policy_setup: "panda_wristcam"
    # One of: sac, rlpd (the SACCore contract -- TD3/DrQv2 and RLPDHybrid
    # are deliberately unsupported, see resolve_algorithm()).
    rlgarden_algorithm: "sac"
    # Passed through as **kwargs to the algorithm's own constructor
    # (rl_garden.algorithms.SAC, etc.) -- any of its normal keyword
    # arguments are valid here.
    rlgarden_algorithm_kwargs:
      device: "cuda"
      buffer_device: "cpu"
      batch_size: 256
    obs_dim: 42  # verified, see header note
    action_dim: 4  # verified, see header note (pd_ee_delta_pos is 4-DoF)
    num_action_chunks: 1
    gradient_steps_per_call: 32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
